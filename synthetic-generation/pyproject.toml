[project]
name = "synthetic-generation"
version = "0.1.0"
description = "Synthetic two-speaker TTS conversation generation and alignment proof of concept."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "soundfile>=0.12",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0",
]
qwen = [
    "qwen-tts==0.1.1",
    "torch",
    "torchaudio",
]
chatterbox = [
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
]
prompt = [
    "accelerate>=1.10.0",
    "huggingface-hub>=0.34.0",
    "torch>=2.7.0",
    "transformers>=4.55.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ARG", "PTH"]
ignore = ["ANN401"]

[tool.uv]
conflicts = [
    [
        { extra = "chatterbox" },
        { extra = "prompt" },
    ],
    [
        { extra = "chatterbox" },
        { extra = "qwen" },
    ],
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests requiring external infrastructure or model/API access",
]
testpaths = ["tests"]

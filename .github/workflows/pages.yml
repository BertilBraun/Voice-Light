name: Deploy public voice demo

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pages.yml"
      - "app/local/web/pages/voice-agent/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload voice demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/local/web/pages/voice-agent
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
